openapi: 3.1.0
info:
  title: SmartPump API
  version: 0.1.0
  description: |
    Contrato inicial da API de controle da bomba, válvula e receitas.
    A API separa os domínios, enquanto os clientes podem reuni-los em um
    único painel operacional. Comandos físicos exigem confirmação temporária
    e chave de idempotência.
servers:
  - url: /api/v1
    description: Instância atual
tags:
  - name: Status
  - name: Dispositivos
  - name: Configurações
  - name: Receitas
  - name: Controle
  - name: Operações
  - name: Execuções

paths:
  /status:
    get:
      tags: [Status]
      operationId: getStatus
      summary: Obtém a visão consolidada da aplicação
      responses:
        "200":
          description: Estado atual, sem provocar acesso serial concorrente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationStatus"
        default:
          $ref: "#/components/responses/Error"

  /serial-ports:
    get:
      tags: [Dispositivos]
      operationId: listSerialPorts
      summary: Lista portas seriais disponíveis sem abri-las
      responses:
        "200":
          description: Portas detectadas pelo sistema operacional.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SerialPort"
        default:
          $ref: "#/components/responses/Error"

  /settings:
    get:
      tags: [Configurações]
      operationId: getSettings
      summary: Obtém configurações desejadas e efetivas
      responses:
        "200":
          description: Configurações atuais.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsDocument"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Configurações]
      operationId: replaceSettings
      summary: Valida e salva a configuração desejada
      description: Não aplica alterações ao hardware.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Configuração salva.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsDocument"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        default:
          $ref: "#/components/responses/Error"

  /settings/apply:
    post:
      tags: [Configurações]
      operationId: applySettings
      summary: Aplica uma revisão de configuração aos dispositivos
      parameters:
        - $ref: "#/components/parameters/ConfirmationToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision:
                  type: string
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /recipes:
    get:
      tags: [Receitas]
      operationId: listRecipes
      summary: Lista receitas disponíveis
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de receitas.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecipeSummary"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Receitas]
      operationId: createRecipe
      summary: Cria uma receita validada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "201":
          description: Receita criada.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDocument"
        default:
          $ref: "#/components/responses/Error"

  /recipes/preview:
    post:
      tags: [Receitas]
      operationId: previewRecipe
      summary: Valida e expande uma receita sem salvá-la
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: Plano calculado da receita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipePreview"
        default:
          $ref: "#/components/responses/Error"

  /recipes/{recipe_id}:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    get:
      tags: [Receitas]
      operationId: getRecipe
      summary: Obtém uma receita completa
      responses:
        "200":
          description: Receita encontrada.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDocument"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Receitas]
      operationId: replaceRecipe
      summary: Substitui uma receita usando controle de concorrência
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: Receita atualizada.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDocument"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Receitas]
      operationId: deleteRecipe
      summary: Exclui uma receita sem apagar o histórico de execuções
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Receita excluída.
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        default:
          $ref: "#/components/responses/Error"

  /control/confirmations:
    post:
      tags: [Controle]
      operationId: prepareConfirmation
      summary: Prepara uma ação física sem executá-la
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmationRequest"
      responses:
        "201":
          description: Confirmação temporária criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Confirmation"
        default:
          $ref: "#/components/responses/Error"

  /control/commands:
    post:
      tags: [Controle]
      operationId: executeManualCommand
      summary: Executa um comando manual tipado
      parameters:
        - $ref: "#/components/parameters/ConfirmationToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualCommand"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /operations/{operation_id}:
    get:
      tags: [Operações]
      operationId: getOperation
      summary: Consulta uma operação assíncrona
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Estado da operação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /runs:
    get:
      tags: [Execuções]
      operationId: listRuns
      summary: Lista o histórico de execuções
      parameters:
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/RunState"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de execuções.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Run"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Execuções]
      operationId: startRun
      summary: Inicia uma execução a partir de uma revisão imutável
      parameters:
        - $ref: "#/components/parameters/ConfirmationToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "202":
          description: Execução aceita.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /runs/{run_id}:
    get:
      tags: [Execuções]
      operationId: getRun
      summary: Obtém progresso e resultado de uma execução
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Execução encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /runs/{run_id}/events:
    get:
      tags: [Execuções]
      operationId: listRunEvents
      summary: Lista eventos persistidos de uma execução
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página de eventos.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RunEvent"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"

  /runs/{run_id}/stop:
    post:
      tags: [Execuções]
      operationId: stopRun
      summary: Solicita interrupção segura de uma execução
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ConfirmationToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 300
      responses:
        "202":
          description: Solicitação de parada aceita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

components:
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag retornado pela leitura anterior.
      schema:
        type: string
    ConfirmationToken:
      name: X-Confirmation-Token
      in: header
      required: true
      description: Token temporário, de uso único e vinculado à ação.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave única por ação para impedir comandos físicos duplicados.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    RecipeId:
      name: recipe_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  headers:
    ETag:
      description: Revisão opaca do recurso.
      schema:
        type: string

  responses:
    Error:
      description: Erro da solicitação ou do controlador.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Estado atual incompatível com a ação solicitada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PreconditionFailed:
      description: A revisão enviada não corresponde à revisão atual.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PreconditionRequired:
      description: O cabeçalho If-Match é obrigatório.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OperationAccepted:
      description: Operação aceita para processamento.
      headers:
        Location:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Operation"

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string

    SerialPort:
      type: object
      required: [path, label]
      properties:
        path:
          type: string
          examples: [COM3]
        label:
          type: string
          examples: [USB Serial Device]
        manufacturer:
          type: [string, "null"]
        serial_number:
          type: [string, "null"]
        in_use_by:
          type: [string, "null"]
          enum: [valve, pump, null]

    DeviceSettings:
      type: object
      additionalProperties: false
      required: [enabled, port, baud_rate]
      properties:
        enabled:
          type: boolean
        port:
          type: [string, "null"]
        baud_rate:
          type: integer
          minimum: 1

    SettingsInput:
      type: object
      additionalProperties: false
      required: [valve, pump, channel_labels]
      properties:
        valve:
          $ref: "#/components/schemas/DeviceSettings"
        pump:
          $ref: "#/components/schemas/DeviceSettings"
        channel_labels:
          type: object
          propertyNames:
            pattern: "^[1-6]$"
          additionalProperties:
            type: string

    SettingsDocument:
      type: object
      required: [desired, desired_revision, effective, effective_revision]
      properties:
        desired:
          $ref: "#/components/schemas/SettingsInput"
        desired_revision:
          type: string
        effective:
          $ref: "#/components/schemas/SettingsInput"
        effective_revision:
          type: string

    DeviceObservation:
      type: object
      required: [enabled, connected, state, observed_at, stale]
      properties:
        enabled:
          type: boolean
        connected:
          type: boolean
        state:
          type: string
          enum: [disabled, disconnected, connecting, ready, busy, fault, unknown]
        observed_at:
          type: string
          format: date-time
        stale:
          type: boolean
        error:
          type: [string, "null"]

    ValveStatus:
      allOf:
        - $ref: "#/components/schemas/DeviceObservation"
        - type: object
          required: [channel, homing_required]
          properties:
            channel:
              type: [integer, "null"]
              minimum: 1
              maximum: 6
            homing_required:
              type: boolean

    PumpStatus:
      allOf:
        - $ref: "#/components/schemas/DeviceObservation"
        - type: object
          required: [running, rpm, flow_rate_ml_min, direction]
          properties:
            running:
              type: [boolean, "null"]
            rpm:
              type: [number, "null"]
            flow_rate_ml_min:
              type: [number, "null"]
            direction:
              type: [string, "null"]
              enum: [clockwise, counterclockwise, stopped, null]

    ApplicationStatus:
      type: object
      required:
        - server_time
        - uptime_seconds
        - settings_revision
        - effective_settings_revision
        - devices
        - active_run
        - active_operation
        - allowed_actions
      properties:
        server_time:
          type: string
          format: date-time
        uptime_seconds:
          type: number
          minimum: 0
        settings_revision:
          type: string
        effective_settings_revision:
          type: string
        devices:
          type: object
          required: [valve, pump]
          properties:
            valve:
              $ref: "#/components/schemas/ValveStatus"
            pump:
              $ref: "#/components/schemas/PumpStatus"
        active_run:
          oneOf:
            - $ref: "#/components/schemas/RunProgress"
            - type: "null"
        active_operation:
          oneOf:
            - $ref: "#/components/schemas/Operation"
            - type: "null"
        allowed_actions:
          type: array
          items:
            $ref: "#/components/schemas/AllowedAction"

    AllowedAction:
      type: object
      required: [action, allowed]
      properties:
        action:
          type: string
        allowed:
          type: boolean
        reason:
          type: [string, "null"]

    RecipeLeafStep:
      type: object
      additionalProperties: false
      required: [channel, solution, duration_minutes]
      properties:
        id:
          type: [string, "null"]
        description:
          type: [string, "null"]
        channel:
          type: integer
          minimum: 1
          maximum: 6
        solution:
          type: string
          minLength: 1
        duration_minutes:
          type: number
          exclusiveMinimum: 0
        flow_rate_ml_min:
          type: [number, "null"]
          description: Valor assinado; zero para a bomba e valores negativos invertem o sentido.

    RecipeLoop:
      type: object
      additionalProperties: false
      required: [cycles, steps]
      properties:
        id:
          type: [string, "null"]
        description:
          type: [string, "null"]
        cycles:
          type: integer
          minimum: 1
        flow_rate_ml_min:
          type: [number, "null"]
          description: Sobrescreve a vazão herdada para todo o loop.
        steps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RecipeNode"

    RecipeNode:
      oneOf:
        - $ref: "#/components/schemas/RecipeLeafStep"
        - $ref: "#/components/schemas/RecipeLoop"

    RecipeInput:
      type: object
      additionalProperties: false
      required: [schema_version, name, cycles, steps]
      properties:
        schema_version:
          type: integer
          const: 1
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          default: ""
        cycles:
          type: integer
          minimum: 1
          default: 1
        flow_rate_ml_min:
          type: [number, "null"]
          description: Vazão padrão herdada por loops e etapas.
        steps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RecipeNode"

    RecipeSummary:
      type: object
      required: [id, revision, name, description, duration_minutes, leaf_step_count]
      properties:
        id:
          type: string
        revision:
          type: string
        name:
          type: string
        description:
          type: string
        duration_minutes:
          type: number
          minimum: 0
        leaf_step_count:
          type: integer
          minimum: 0

    RecipeDocument:
      type: object
      required: [id, revision, recipe]
      properties:
        id:
          type: string
        revision:
          type: string
        recipe:
          $ref: "#/components/schemas/RecipeInput"

    RecipePreview:
      type: object
      required: [valid, duration_minutes, leaf_step_count, expanded_steps]
      properties:
        valid:
          type: boolean
        duration_minutes:
          type: number
          minimum: 0
        leaf_step_count:
          type: integer
          minimum: 0
        expanded_steps:
          type: array
          items:
            type: object
            required: [index, channel, solution, duration_minutes, effective_flow_rate_ml_min]
            properties:
              index:
                type: integer
                minimum: 1
              channel:
                type: integer
              solution:
                type: string
              duration_minutes:
                type: number
              effective_flow_rate_ml_min:
                type: [number, "null"]
              loop_path:
                type: array
                items:
                  type: object
                  required: [iteration, repeat]
                  properties:
                    loop_id:
                      type: [string, "null"]
                    iteration:
                      type: integer
                    repeat:
                      type: integer

    ConfirmationRequest:
      type: object
      additionalProperties: false
      required: [method, path, body]
      properties:
        method:
          type: string
          enum: [POST]
        path:
          type: string
          description: Somente rotas físicas permitidas pelo servidor.
        body:
          type: object
          additionalProperties: true

    Confirmation:
      type: object
      required: [token, summary, expires_at]
      properties:
        token:
          type: string
        summary:
          type: string
        effects:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time

    ManualCommand:
      oneOf:
        - $ref: "#/components/schemas/DeviceCommand"
        - $ref: "#/components/schemas/ValveChannelCommand"
        - $ref: "#/components/schemas/ValveHomeCommand"
        - $ref: "#/components/schemas/PumpFlowCommand"
        - $ref: "#/components/schemas/PumpStartStopCommand"
      discriminator:
        propertyName: action

    DeviceCommand:
      type: object
      additionalProperties: false
      required: [action, parameters]
      properties:
        action:
          type: string
          enum: [devices.connect, devices.disconnect]
        parameters:
          type: object
          additionalProperties: false
          required: [device]
          properties:
            device:
              type: string
              enum: [valve, pump, all]

    ValveChannelCommand:
      type: object
      additionalProperties: false
      required: [action, parameters]
      properties:
        action:
          const: valve.select_channel
        parameters:
          type: object
          additionalProperties: false
          required: [channel]
          properties:
            channel:
              type: integer
              minimum: 1
              maximum: 6

    ValveHomeCommand:
      type: object
      additionalProperties: false
      required: [action, parameters]
      properties:
        action:
          const: valve.home
        parameters:
          type: object
          additionalProperties: false

    PumpFlowCommand:
      type: object
      additionalProperties: false
      required: [action, parameters]
      properties:
        action:
          const: pump.set_flow
        parameters:
          type: object
          additionalProperties: false
          required: [flow_rate_ml_min]
          properties:
            flow_rate_ml_min:
              type: number
              description: Positivo horário, negativo anti-horário e zero para.

    PumpStartStopCommand:
      type: object
      additionalProperties: false
      required: [action, parameters]
      properties:
        action:
          type: string
          enum: [pump.start, pump.stop]
        parameters:
          type: object
          additionalProperties: false

    OperationState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, unknown]

    Operation:
      type: object
      required: [id, state, action, created_at]
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/OperationState"
        action:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        result:
          type: [object, "null"]
          additionalProperties: true
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorEnvelope"
            - type: "null"

    PumpMode:
      type: string
      enum: [controlled, external, disabled]

    StartRunRequest:
      type: object
      additionalProperties: false
      required: [recipe_id, recipe_revision, pump_mode]
      properties:
        recipe_id:
          type: string
        recipe_revision:
          type: string
        pump_mode:
          $ref: "#/components/schemas/PumpMode"

    RunState:
      type: string
      enum: [starting, running, stopping, completed, stopped, failed, unknown]

    LoopProgress:
      type: object
      required: [iteration, repeat]
      properties:
        loop_id:
          type: [string, "null"]
        description:
          type: [string, "null"]
        iteration:
          type: integer
          minimum: 1
        repeat:
          type: integer
          minimum: 1

    RunProgress:
      type: object
      required:
        - run_id
        - state
        - phase
        - global_step_index
        - total_steps
        - loop_stack
        - elapsed_seconds
      properties:
        run_id:
          type: string
        state:
          $ref: "#/components/schemas/RunState"
        phase:
          type: string
          enum: [preparing, switching_channel, pumping, waiting, stopping, finished]
        step_id:
          type: [string, "null"]
        step_description:
          type: [string, "null"]
        channel:
          type: [integer, "null"]
        solution:
          type: [string, "null"]
        global_step_index:
          type: integer
          minimum: 0
        total_steps:
          type: integer
          minimum: 0
        loop_stack:
          type: array
          items:
            $ref: "#/components/schemas/LoopProgress"
        step_remaining_seconds:
          type: [number, "null"]
        scheduled_remaining_seconds:
          type: [number, "null"]
        elapsed_seconds:
          type: number
          minimum: 0

    Run:
      type: object
      required:
        - id
        - state
        - recipe_id
        - recipe_revision
        - recipe_snapshot
        - settings_revision
        - pump_mode
        - created_at
        - progress
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/RunState"
        recipe_id:
          type: string
        recipe_revision:
          type: string
        recipe_snapshot:
          $ref: "#/components/schemas/RecipeInput"
        settings_revision:
          type: string
        pump_mode:
          $ref: "#/components/schemas/PumpMode"
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        progress:
          $ref: "#/components/schemas/RunProgress"
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorEnvelope"
            - type: "null"

    RunEvent:
      type: object
      required: [id, run_id, type, occurred_at, data]
      properties:
        id:
          type: string
        run_id:
          type: string
        type:
          type: string
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
