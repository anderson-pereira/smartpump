[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartpump"
version = "0.1.0"
description = "Controle de válvula Cavro e bomba de fluxo por receitas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "pyserial>=3.5",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
smartpump = "smartpump.interfaces.cli:main"
smartpump-web = "smartpump.interfaces.api.cli:main"

[tool.setuptools.package-data]
smartpump = ["py.typed"]

[tool.setuptools.packages.find]
include = ["smartpump*"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
